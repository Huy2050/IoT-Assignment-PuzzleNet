; PlatformIO Project Configuration File for ESP32-S3 (N16R8)
;
; - Chip: ESP32-S3
; - Flash: 16MB (N16)
; - PSRAM: 8MB OPI PSRAM (R8)

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Tốc độ nạp code và Serial Monitor
monitor_speed = 115200
upload_speed = 921600

; Cấu hình 16MB Flash
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Cấu hình bộ nhớ cho N16R8: Quad-SPI Flash + Octal-SPI PSRAM (8MB)
; (Nếu dùng module Flash OPI thì đổi thành opi_opi)
board_build.arduino.memory_type = qio_opi

; Build flags cần thiết cho ESP32-S3 và PSRAM
build_flags = 
    -DBOARD_HAS_PSRAM                   ; Bật hỗ trợ 8MB PSRAM ngoài
    -DARDUINO_USB_CDC_ON_BOOT=1         ; Cho phép in Serial qua cổng USB trực tiếp của S3
    -DARDUINO_USB_MODE=1                ; Chế độ USB OTG/CDC
    -DCORE_DEBUG_LEVEL=1                ; Mức log debug (0: None, 1: Error, 2: Warn, 3: Info)

lib_deps =
    ;Thư viện LCD
    LCD

